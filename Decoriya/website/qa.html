<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Декория v6.1 / Проверка геометрии</title><style>body{font:15px/1.6 system-ui;background:#f6f0e5;color:#57212f;padding:24px}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #d4c6bd}iframe{position:absolute;left:-20000px;border:0;height:1000px}.fail{color:#a73434}.pass{color:#145a32}code{white-space:pre-wrap}h1{font-size:30px}</style><h1>Декория v6.1 / геометрия и содержимое</h1><p>Обычный текст и стресс-проверка +25% размера шрифта для всех видимых текстовых элементов. Это измерение компоновки, не эмуляция браузерного zoom. Кнопки проверяются по реальным строкам.</p><table><thead><tr><th>Ширина</th><th>Текст</th><th>Переполнение</th><th>H1</th><th>Кнопки</th><th>Якоря</th><th>Golos</th><th>Высота</th></tr></thead><tbody id="results"></tbody></table><p id="status">Выполняется</p><code id="errors"></code><script>
const widths=[360,390,600,768,900,1024,1440,1920];let done=0,failed=0;
for(const width of widths)for(const stress of [false,true]){const f=document.createElement('iframe');f.width=width;f.src='index.html';f.title=`${width} / ${stress?125:100}%`;f.onload=async()=>{const d=f.contentDocument,w=f.contentWindow;await d.fonts.ready;if(stress){const items=[...d.querySelectorAll('body *')].filter(el=>[...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())&&w.getComputedStyle(el).display!=='none');const sizes=items.map(el=>parseFloat(w.getComputedStyle(el).fontSize));items.forEach((el,i)=>el.style.fontSize=sizes[i]*1.25+'px');}const actual=d.documentElement.clientWidth,overflow=d.documentElement.scrollWidth-actual;const badLinks=[...d.querySelectorAll('a[href^="#"]')].filter(a=>!d.getElementById(a.hash.slice(1)));const wrap=[];for(const el of d.querySelectorAll('.btn,.mobile-contact')){if(!el.getClientRects().length)continue;const range=d.createRange();const t=[...el.childNodes].find(n=>n.nodeType===3&&n.textContent.trim());if(!t)continue;range.selectNode(t);const rects=[...range.getClientRects()].filter(r=>r.width>0);if(rects.length>1)wrap.push(el.textContent.trim());}const h1=d.querySelectorAll('h1').length,font=d.fonts.check('16px Golos') && d.documentElement.dataset.dkReady==='true';const pass=overflow<=0&&h1===1&&!badLinks.length&&!wrap.length&&font;const tr=document.createElement('tr');tr.className=pass?'pass':'fail';tr.innerHTML=`<td>${width}</td><td>${stress?'125%':'100%'}</td><td>${overflow} px</td><td>${h1}</td><td>${wrap.length} переносов</td><td>${badLinks.length} ошибок</td><td>${font?'OK':'ошибка'}</td><td>${d.documentElement.scrollHeight}</td>`;document.querySelector('#results').append(tr);if(!pass){failed++;document.querySelector('#errors').textContent+=`${width}/${stress?125:100}%: overflow ${overflow}, buttons ${wrap.join('|')}\n`;if(overflow>0){document.querySelector('#errors').textContent+=[...d.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect();return r.width&&r.right>actual+1&&!el.closest(".media-rail")}).map(el=>el.tagName+'.'+el.className).slice(0,12).join(', ')+'\n';}}if(++done===16)document.querySelector('#status').textContent='Проверено '+done+' вариантов. Нарушений: '+failed;};document.body.append(f)}
</script></html>
