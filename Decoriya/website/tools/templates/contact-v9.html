<section id="contact" class="lead-contact v10-contact" aria-labelledby="lead-heading">
  <div class="lead-shell">
    <div class="lead-introduction">
      <h2 id="lead-heading" tabindex="-1">Обсудим ваш объект</h2>
      <p>Расскажите, что хотите оформить. Уточним задачу и предложим, с чего начать.</p>
    </div>
    <form id="brief-form" class="lead-form" method="post" novalidate data-lead-form="project">
      <div class="brief-summary" aria-live="polite"><p>Ориентир для проекта</p><p id="chosen-zone" hidden></p><p id="chosen-date" hidden></p><p id="chosen-case" hidden></p><p id="chosen-business" hidden></p><p id="chosen-style" hidden></p><p id="chosen-format" hidden></p><p id="chosen-occasion" hidden></p><button id="clear-context" type="button" class="context-reset" hidden>Убрать выбранное</button></div>
      <input type="hidden" name="business"><input type="hidden" name="zone"><input type="hidden" name="occasion"><input type="hidden" name="style"><input type="hidden" name="format"><input type="hidden" name="date">
      <label>Ваше имя <input name="name" maxlength="80" autocomplete="name" placeholder="Как к вам обращаться"></label>
      <label>Телефон * <input name="phone" required type="tel" maxlength="26" autocomplete="tel" placeholder="+7 (___) ___-__-__" aria-describedby="brief-phone-error"><small id="brief-phone-error" data-error="phone" hidden></small></label>
      <label>Что хотите оформить? (по желанию)<textarea name="object" rows="3" maxlength="1000" placeholder="Например, вход в кафе к Новому году"></textarea></label>
      {{CONSENT_PROJECT}}
      <button class="btn lead-send" type="submit" disabled>Отправить заявку <svg class="btn-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" stroke="currentColor" stroke-width="1.6"/></svg></button>
      {{LEAD_AVAILABILITY}}
      <p id="brief-status" data-lead-status role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
