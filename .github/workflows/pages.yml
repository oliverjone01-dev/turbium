name: Publish site to gh-pages
on:
  push:
    branches: [main]
    paths: ['www/**', 'site/**', 'strategy/**', 'deploy/**', 'compose*.yaml', 'scripts/*landing.py', 'wordpress/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check landing and VPS package
        run: |
          python3 scripts/check-landing.py
          node --check www/landing/assets/app.js
          docker compose config --quiet
          DOMAIN=example.com docker compose -f compose.vps.yaml config --quiet
          docker compose run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile
          DOMAIN=example.com docker compose -f compose.vps.yaml run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile
          trap 'docker compose down' EXIT
          docker compose up -d --wait --wait-timeout 90
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/healthz.txt
          curl --fail -o /dev/null http://127.0.0.1:8080/assets/app.js
          curl --fail -o /dev/null http://127.0.0.1:8080/assets/country-team-900.webp
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)" = "404"
      - name: Build site
        run: |
          mkdir -p _site
          # public marketing site at root
          cp -r www/* _site/
          # locked internal brand platform at /platform/
          mkdir -p _site/platform
          cp site/turbium-locked.html _site/platform/index.html
          # locked internal strategy room at /strategy/
          mkdir -p _site/strategy
          cp strategy/strategy-locked.html _site/strategy/index.html
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "turbium-ci"
          git config user.email "ci@turbium.local"
          git add -A
          git commit -m "deploy: $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
