name: Publish site to gh-pages
on:
  push:
    branches: [main]
    paths: ['www/**', 'site/**', 'strategy/**', 'Decoriya/**', 'deploy/**', 'compose*.yaml', 'scripts/*landing.py', 'wordpress/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check landing and VPS package
        run: |
          python3 scripts/check-landing.py
          node --check www/landing/assets/app.js
          node --check Decoriya/app.js
          node --check Decoriya/data.js
          python3 Decoriya/tools/check.py
          docker compose config --quiet
          DOMAIN=example.com docker compose -f compose.vps.yaml config --quiet
          docker compose run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile
          DOMAIN=example.com docker compose -f compose.vps.yaml run --rm --no-deps web caddy validate --config /etc/caddy/Caddyfile
          trap 'docker compose down' EXIT
          docker compose up -d --wait --wait-timeout 90
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/healthz.txt
          curl --fail -o /dev/null http://127.0.0.1:8080/assets/app.js
          curl --fail -o /dev/null http://127.0.0.1:8080/assets/country-team-900.webp
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)" = "404"
      - name: Build site
        run: |
          python3 Decoriya/website/tools/package-wordpress.py
          mkdir -p _site
          # public marketing site at root
          cp -r www/* _site/
          # locked internal brand platform at /platform/
          mkdir -p _site/platform
          cp site/turbium-locked.html _site/platform/index.html
          # locked internal strategy room at /strategy/
          mkdir -p _site/strategy
          cp strategy/strategy-locked.html _site/strategy/index.html
          # partner demonstration of DEKORIYA at /Decoriya/
          mkdir -p _site/Decoriya
          cp Decoriya/index.html _site/Decoriya/partner.html
          cp Decoriya/website-entry.html _site/Decoriya/index.html
          cp Decoriya/styles.css Decoriya/app.js Decoriya/data.js _site/Decoriya/
          cp -r Decoriya/assets _site/Decoriya/
          # DEKORIYA business website lives beside the partner demonstration
          mkdir -p _site/Decoriya/website
          cp Decoriya/website/index.html Decoriya/website/site.css Decoriya/website/wow.css Decoriya/website/spatial.css Decoriya/website/app.js Decoriya/website/motion.js Decoriya/website/motion-config.js Decoriya/website/motion-map.html Decoriya/website/design-system.html Decoriya/website/qa.html _site/Decoriya/website/
          cp -r Decoriya/website/assets Decoriya/website/media _site/Decoriya/website/
          cp Decoriya/website/site-core.js Decoriya/website/v9-motion.js Decoriya/website/v9.css Decoriya/website/motion.css _site/Decoriya/website/
          cp Decoriya/website/v81.css Decoriya/website/v81-site.css Decoriya/website/v81.js Decoriya/website/cases.json Decoriya/website/sitemap.xml _site/Decoriya/website/
          cp -r Decoriya/website/projects _site/Decoriya/website/
          # Preserve old prototype links as redirects to the canonical homepage.
          mkdir -p _site/Decoriya/website/v9
          cp Decoriya/website/v9/index.html Decoriya/website/v9/motion.css Decoriya/website/v9/motion.js Decoriya/website/v9/site-core.js Decoriya/website/v9/qa.json _site/Decoriya/website/v9/
          mkdir -p _site/Decoriya/website/downloads
          cp Decoriya/website/wordpress/dekoriya-atelier-v9.zip _site/Decoriya/website/downloads/
          cp Decoriya/website/robots.txt _site/robots.txt
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "turbium-ci"
          git config user.email "ci@turbium.local"
          git add -A
          git commit -m "deploy: $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
