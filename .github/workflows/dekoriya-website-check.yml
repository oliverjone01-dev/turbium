name: Check DEKORIYA business website
on:
  pull_request:
    paths: ['Decoriya/website/**', '.github/workflows/dekoriya-website-check.yml']
  push:
    branches: [main, codex/dekoriya-camera-v641]
    paths: ['Decoriya/website/**', '.github/workflows/dekoriya-website-check.yml']
permissions:
  contents: read
jobs:
  frontend-and-theme:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Decoriya/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate canonical v10, case pages and WordPress package
        run: |
          python3 tools/check-v81.py
          node --check v81.js
          python3 tools/package-wordpress.py
          python3 tools/check-v9.py
          find wordpress/dekoriya-atelier -name "*.php" -print0 | xargs -0 -n1 php -l
          node --check site-core.js
          node --check v9-motion.js
          node --check v10-lead.js
          node --check v10.js
