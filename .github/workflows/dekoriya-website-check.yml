name: Check DEKORIYA business website
on:
  pull_request:
    paths: ['Decoriya/website/**', '.github/workflows/dekoriya-website-check.yml']
  push:
    branches: [main, codex/dekoriya-camera-v641]
    paths: ['Decoriya/website/**', '.github/workflows/dekoriya-website-check.yml']
permissions:
  contents: read
jobs:
  frontend-and-theme:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Decoriya/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate v8.1 pages, assets and scripts
        run: |
          python3 tools/check-v81.py
          node --check v81.js
          python3 tools/check-v9.py
          node --check v9/site-core.js
          node --check v9/motion.js
